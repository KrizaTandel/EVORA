<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Password Recovery for EVORA HRMS">
  <title>Reset Password — EVORA HRMS</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: #FFFFFF;
      border: 1px solid var(--color-cream-border);
      border-radius: var(--radius-lg);
      padding: 2.25rem;
      box-shadow: var(--shadow-md);
    }
    .auth-brand {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .auth-brand h1 {
      font-size: 1.8rem;
      margin-bottom: 0.25rem;
    }
    .auth-brand p {
      color: var(--color-text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-brand">
        <h1>EVORA HRMS</h1>
        <p>Password Assistance</p>
      </div>

      <div class="placeholder-notice" id="reset-notice">
        <strong>Placeholder View:</strong> In a production setting, this sends a secure reset token. For our college project, verification links are generated and validated on the backend.
      </div>

      <form id="form-forgot-password" onsubmit="event.preventDefault();">
        <div class="form-group">
          <label class="form-label" for="reset-email">Registered Email Address</label>
          <input type="email" id="reset-email" class="form-control" placeholder="user@example.com" required autocomplete="email">
        </div>

        <button type="submit" class="btn btn-primary" id="btn-submit-forgot" style="width: 100%; margin-top: 0.5rem;">
          Send Reset Instructions
        </button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--color-text-muted);">
        Remembered your credentials? <a href="login.html" style="font-weight: 600;">Back to login</a>
      </div>
      <div style="margin-top: 0.75rem; text-align: center; font-size: 0.8rem; color: var(--color-text-muted);">
        <a href="../index.html">&larr; Back to Welcome Portal</a>
      </div>
    </div>
  </div>

  <script src="../assets/js/main.js"></script>
</body>
</html>
