<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign In to EVORA HRMS Portal">
  <title>Sign In — EVORA HRMS</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: #FFFFFF;
      border: 1px solid var(--color-cream-border);
      border-radius: var(--radius-lg);
      padding: 2.25rem;
      box-shadow: var(--shadow-md);
    }
    .auth-brand {
      text-align: center;
      margin-bottom: 1.75rem;
    }
    .auth-brand h1 {
      font-size: 1.8rem;
      margin-bottom: 0.25rem;
    }
    .auth-brand p {
      color: var(--color-text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-brand">
        <h1>EVORA HRMS</h1>
        <p>Sign in to your account</p>
      </div>

      <div class="placeholder-notice" id="login-notice">
        <strong>Placeholder View:</strong> Authentication will connect to <code>backend/auth/login.php</code> with password hashing and session management.
      </div>

      <form id="form-login" onsubmit="event.preventDefault();">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="user@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
            <label class="form-label" for="login-password" style="margin-bottom: 0;">Password</label>
            <a href="forgot-password.html" style="font-size: 0.8rem;">Forgot password?</a>
          </div>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary" id="btn-submit-login" style="width: 100%; margin-top: 0.5rem;">
          Sign In
        </button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--color-text-muted);">
        Need an employee account? <a href="signup.html" style="font-weight: 600;">Register here</a>
      </div>
      <div style="margin-top: 0.75rem; text-align: center; font-size: 0.8rem; color: var(--color-text-muted);">
        <a href="../index.html">&larr; Back to Welcome Portal</a>
      </div>
    </div>
  </div>

  <script src="../assets/js/main.js"></script>
</body>
</html>
