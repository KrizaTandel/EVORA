<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign In — EVORA HRMS Modern Portal">
  <title>Sign In — EVORA HRMS</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--color-ivory);
    }
    .auth-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }
    .auth-card {
      width: 100%;
      max-width: 480px;
      background: #FFFFFF;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: 2.5rem;
      box-shadow: var(--shadow-xl);
    }
    .auth-logo-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      margin-bottom: 1.5rem;
    }
    .auth-banner-alert {
      display: none;
      padding: 0.85rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      line-height: 1.5;
      margin-bottom: 1.25rem;
    }
    .auth-banner-alert.error {
      display: block;
      background-color: #FDF2F2;
      color: #991B1B;
      border: 1px solid #F87171;
    }
    .auth-banner-alert.warning {
      display: block;
      background-color: #FFFBEB;
      color: #92400E;
      border: 1px solid #FCD34D;
    }
    .auth-banner-alert.success {
      display: block;
      background-color: #ECFDF5;
      color: #065F46;
      border: 1px solid #6EE7B7;
    }
  </style>
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo-row">
        <svg class="evora-leaf-logo" width="38" height="38" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="34" height="34" rx="8" fill="url(#evora-leaf-grad)"/>
          <path d="M17 6.5C17 6.5 24 10.5 24 18.5C24 23 20.2 26.5 17 26.5C13.8 26.5 10 23 10 18.5C10 10.5 17 6.5 17 6.5Z" fill="#A8B9A0" fill-opacity="0.3"/>
          <path d="M17 7.5C17 7.5 22.5 11 22.5 17.5C22.5 21.2 19.6 24 17 24C14.4 24 11.5 21.2 11.5 17.5C11.5 11 17 7.5 17 7.5Z" stroke="#A8B9A0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M17 11V23.5M17 15C19 14 20.5 14.5 20.5 14.5M17 18.5C14.8 17.5 13.5 18 13.5 18" stroke="#D7A76D" stroke-width="1.6" stroke-linecap="round"/>
          <defs>
            <linearGradient id="evora-leaf-grad" x1="0" y1="0" x2="34" y2="34" gradientUnits="userSpaceOnUse">
              <stop stop-color="#193126"/>
              <stop offset="1" stop-color="#244536"/>
            </linearGradient>
          </defs>
        </svg>
        <div>
          <span style="font-size: 1.4rem; font-weight: 800; color: var(--color-forest-dark);">EVORA</span>
          <span style="display: block; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-gold-dark);">Human Resource System</span>
        </div>
      </div>

      <div style="text-align: center; margin-bottom: 1.5rem;">
        <h1 style="font-size: 1.75rem; margin-bottom: 0.35rem;">Welcome Back</h1>
        <p style="font-size: 0.92rem;">Sign in to access your organizational workspace.</p>
      </div>

      <!-- Live Feedback Alert Banner -->
      <div id="auth-alert" class="auth-banner-alert" role="alert" aria-live="assertive"></div>

      <!-- Authentication Form -->
      <form id="form-login" novalidate>
        <div class="form-group">
          <label class="form-label" for="login-email">Work Email</label>
          <input type="email" id="login-email" class="form-control" placeholder="user@example.com" required autocomplete="email">
          <div class="invalid-feedback" id="email-error">Please enter a valid work email address.</div>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.45rem;">
            <label class="form-label" for="login-password" style="margin-bottom: 0;">Password</label>
            <a href="forgot-password.html" style="font-size: 0.82rem; font-weight: 600;">Forgot Password?</a>
          </div>
          <div class="password-input-wrap">
            <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">Show</button>
            <div class="invalid-feedback" id="pass-error">Please enter your password.</div>
          </div>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; font-size: 0.86rem;">
          <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
            <input type="checkbox" id="remember-me" style="accent-color: var(--color-forest);">
            <span>Remember session on this device</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary" id="btn-login-submit" style="width: 100%; padding: 0.85rem;">
          Sign In to Portal
        </button>
      </form>

      <div style="margin-top: 1.75rem; text-align: center; font-size: 0.88rem; color: var(--color-text-muted);">
        Don't have an approved account? <a href="signup.html" style="font-weight: 700;">Register as Employee</a>
      </div>

      <div style="margin-top: 1.25rem; text-align: center;">
        <a href="../index.html" style="font-size: 0.82rem; font-weight: 600; color: var(--color-text-muted);">&larr; Return to Welcome Portal</a>
      </div>
    </div>
  </div>

  <script src="../assets/js/main.js"></script>
  <script>
    // Automatic redirection if active approved session exists
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const response = await fetch(`${EVORA.apiBase}/auth/me.php`, {
          method: 'GET',
          credentials: 'same-origin',
          headers: { 'Accept': 'application/json' }
        });
        if (response.ok) {
          const data = await response.json();
          if (data.authenticated && data.user) {
            EVORA.setCurrentUser(data.user);
            const redirectUrl = data.user.role === 'admin' ? 'admin/dashboard.html' : 'employee/dashboard.html';
            window.location.replace(redirectUrl);
          }
        }
      } catch (e) {
        // Stay on login page if offline or unauthenticated
      }
    });

    const alertBox = document.getElementById('auth-alert');
    function showAlert(message, type = 'error') {
      alertBox.textContent = message;
      alertBox.className = `auth-banner-alert ${type}`;
    }
    function hideAlert() {
      alertBox.style.display = 'none';
      alertBox.textContent = '';
      alertBox.className = 'auth-banner-alert';
    }

    document.getElementById('form-login').addEventListener('submit', async function(e) {
      e.preventDefault();
      hideAlert();

      const email = document.getElementById('login-email');
      const pass = document.getElementById('login-password');
      let isValid = true;

      if (!email.value || !email.value.includes('@')) {
        email.classList.add('is-invalid');
        isValid = false;
      } else {
        email.classList.remove('is-invalid');
      }

      if (!pass.value) {
        pass.classList.add('is-invalid');
        isValid = false;
      } else {
        pass.classList.remove('is-invalid');
      }

      if (!isValid) return;

      const submitBtn = document.getElementById('btn-login-submit');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing In...';

      try {
        const response = await fetch(`${EVORA.apiBase}/auth/login.php`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          credentials: 'same-origin',
          body: JSON.stringify({ email: email.value.trim(), password: pass.value })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          showAlert(result.message || 'Login successful! Redirecting...', 'success');
          EVORA.showToast(result.message || 'Login successful!', 'success');

          if (result.user) {
            EVORA.setCurrentUser(result.user);
          }
          if (result.csrf_token) {
            sessionStorage.setItem('evora_csrf_token', result.csrf_token);
          }

          const target = result.redirect || (result.role === 'admin' ? 'admin/dashboard.html' : 'employee/dashboard.html');
          setTimeout(() => {
            window.location.href = target;
          }, 300);
        } else {
          const msg = result.message || 'Invalid email or password.';
          const alertType = (result.status === 'pending' || result.status === 'rejected') ? 'warning' : 'error';
          showAlert(msg, alertType);
          EVORA.showToast(msg, alertType === 'warning' ? 'warning' : 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In to Portal';
        }
      } catch (err) {
        console.error('Login network error', err);
        const errMsg = 'Unable to connect to authentication service. Please verify your connection.';
        showAlert(errMsg, 'error');
        EVORA.showToast(errMsg, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In to Portal';
      }
    });
  </script>
</body>
</html>
